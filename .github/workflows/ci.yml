name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck public examples
        run: pnpm typecheck:examples

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Verify freshly compiled Rust/WASM kernel
        run: |
          rm -f packages/kernel/src/artifacts/causal_kernel_dag_dsep.wasm
          pnpm --filter @causal-js/kernel build:wasm
          pnpm exec vitest run packages/kernel/src

  python-estimation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/python/requirements.txt
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install optional estimation backend
        run: python -m pip install -r tests/python/requirements.txt
      - name: Independent Python estimation acceptance
        run: CAUSAL_JS_PYTHON="$(which python)" pnpm test:python

      - name: Run the known-effect example from the npm tarball
        run: |
          consumer=$(mktemp -d)
          cd packages/causal
          archive=$(npm pack --silent --pack-destination "$consumer")
          cd "$consumer"
          npm install --offline --ignore-scripts --no-audit --no-fund "./$archive"
          CAUSAL_JS_PYTHON="$(which python)" node node_modules/@kanaries/causal/examples/known-effect.mjs > result.json
          node <<'NODE'
          const assert = require("node:assert/strict");
          const result = require("./result.json");
          assert.deepEqual(result.adjustmentSet, ["Z"]);
          assert.ok(Math.abs(result.estimate - result.knownEffect) < 0.1);
          NODE

  external-regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Kanaries/causal-parity
          path: causal-parity
          token: ${{ secrets.CAUSAL_PARITY_REPO_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install external regression dependencies
        run: pnpm install --frozen-lockfile
        working-directory: causal-parity

      - name: External regression tests
        env:
          CAUSAL_JS_SOURCE_ROOT: ${{ github.workspace }}
        run: pnpm exec vitest run --no-file-parallelism --testTimeout=30000
        working-directory: causal-parity
