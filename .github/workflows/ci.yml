name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

  external-regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Kanaries/causal-parity
          path: causal-parity
          token: ${{ secrets.CAUSAL_PARITY_REPO_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install external regression dependencies
        run: pnpm install --frozen-lockfile
        working-directory: causal-parity

      - name: External regression tests
        env:
          CAUSAL_JS_SOURCE_ROOT: ${{ github.workspace }}
        run: pnpm test -- --testTimeout=30000
        working-directory: causal-parity
